<div id="chatWidget" class="chat-widget">
  <div class="chat-header" onclick="toggleChat()"><span>💬 LYLILI AI Support</span><span style="opacity:0.7; font-size:11px;">24/7 premium</span></div>
  <div class="chat-body">
    <div id="chatMessages" class="chat-messages">
      <div class="chat-msg bot">Привет! Я LYLILI AI — премиум поддержка 🩷<br>Спроси про корзину, оплату, подарки.<br><b>Напиши «что исправил?» — покажу конкретный код и тесты.</b></div>
      <div class="chat-chips">
        <button onclick="chatChip('Что в корзине?')">🛒 Корзина</button>
        <button onclick="chatChip('Как оплатить?')">💳 Оплата</button>
        <button onclick="chatChip('Что исправил? Покажи код')">🔧 Что исправил?</button>
        <button onclick="chatChip('Что протестировал?')">✅ Тесты</button>
      </div>
    </div>
    <form id="chatForm" class="chat-form" onsubmit="sendChat(event)">
      <input id="chatInput" type="text" placeholder="Напиши сообщение…" autocomplete="off">
      <button type="submit">➤</button>
    </form>
  </div>
</div>
<button class="chat-fab" onclick="toggleChat()" aria-label="Chat">💬<span id="cartDot" style="display:none;"></span></button>
