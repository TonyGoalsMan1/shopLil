<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — LYLILI.love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ turbo.count if turbo else 0 }}">
</head>
<body>
<header class="header"><div class="container header-inner"><a href="/" class="logo">LYLILI<span>LOVE</span></a><nav class="nav"><a href="/about">{{ t.about }}</a><a href="/" >{{ t.shop }}</a></nav><div class="header-right"><a href="/cart" class="cart-btn">🛒 €{{ cart_total }}.00 <span class="cart-count">{{ cart_count }}</span></a></div></div></header>
<div class="container" style="max-width:800px; padding:40px 24px;">
  <h1 style="font-family:'Playfair Display',serif; font-size:32px; text-align:center;">{{ title }}</h1>
  <div style="margin-top:20px; background:#fff; border:1px solid #f0e6e0; border-radius:16px; padding:24px; line-height:1.7; color:#333; font-size:14px;">
    {{ content }}
    <br><br>
    <div style="background:#f7f5f4; border:1px solid #f0e6e0; border-radius:10px; padding:12px; font-size:12px; color:#666;">Как на lylili.love/{{ title.lower().replace(' ', '-') }} — страница как на оригинале, контент подтягивается.</div>
  </div>
  <div style="text-align:center; margin-top:16px;"><a href="/" class="btn">← Магазин</a></div>
</div>
<footer class="footer"><div class="container"><div class="copy"><span>© 2026 LYLILI.love</span></div></div></footer>
</body>
</html>
